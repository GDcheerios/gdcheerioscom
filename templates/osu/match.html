<html>
    <head>
        {% block head %}
        <title>{{ match.name }} Score Farm</title>
        <link rel="stylesheet" href="/static/style.css">
        <link rel="stylesheet" href="/static/osu-style.css">
        {% endblock %}
    </head>
    <body style="background-color: #0a0a1a;">
    {% include 'navbar.html' %}
        {% block body %}
            <h1 style="text-align: center">{{ match.name }}</h1>
            <div id="match-highlight" class="osu-box" style="height: 10%; width: 20%; margin: auto;">
                <h4>Highlight</h4>
            </div>
            <div style="display: flex; flex-direction: row; justify-content: space-evenly; height: 50%; width: 80%; margin: auto;">
                <div class="osu-box" style="width: 50%;">
                    <div id="players-list" style="height: 75%;">
                    </div>
                    <div id="you-container" style="height: 25%; display: none;">
                        <div style="width: 100%; height: 2px; background: linear-gradient(to right, transparent 0%, rgba(100, 150, 220, 0.8) 50%, transparent 100%); margin: 10px 0;"></div>
                        <div id="your-card"></div>
                        <div id="controls" style="display: flex;">
                            <button id="refresh-button"
                                    style="padding: 10px 20px; font-size: 16px; font-weight: bold; color: #fff; background: linear-gradient(135deg, rgba(15, 30, 70, 0.85), rgba(25, 45, 90, 0.65)); border: 2px solid rgba(100, 150, 220, 0.8); border-radius: 12px; cursor: pointer; margin: 10px auto;">
                                Refresh
                            </button>
                        </div>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; justify-content: space-evenly; width: 30%;">
                    <div id="teams" class="osu-box" style="height: 35%;">
                        <h6>Teams</h6>
                    </div>
                    <div id="recent-plays" class="osu-box" style="height: 60%;">
                        <h6>Recent Plays</h6>
                    </div>
                </div>
            </div>
            <div id="stats">
                <h1>Please invest in gdcheerios supporter for this.</h1>
            </div>
        {% endblock %}
    <script>
        const matchId = {{ match_id|int }};
        const matchPrimary = "ranked_score";
        const matchSecondary = "playcount";
        const matchReconstruct = false; // determines if reconstructing pp from ground up
        const ID = {{ current_osu_id }};
        const players = new Map();

        class PlayerCard {
            constructor(id) {
                console.log("Creating player card for id:", id);
                this.element = document.createElement('div');
                this.element.classList.add('player');
                this.usernameEl = document.createElement('a');
                this.usernameEl.classList.add('username');
                this.placementEl = document.createElement('h3');
                this.placementEl.classList.add('placement');
                this.avatarEl = document.createElement('img');
                this.avatarEl.classList.add('avatar');
                this.objectiveEl = document.createElement('h3');
                this.objectiveEl.classList.add('objective');
                this.id = id;
            }

            updateData(playerData) {
                if (!playerData || playerData.id == null) {
                    console.error("Invalid player data:", playerData);
                    return false;
                }

                this.id = playerData.id;
                this.username = playerData.username;
                this.placement = 0;
                this.total_score = playerData.total_score;
                this.ranked_score = playerData.ranked_score;
                this.playcount = playerData.playcount;
                this.total_hits = playerData.total_hits;
                this.accuracy = playerData.accuracy;
                this.global_rank = playerData.global_rank;
                this.country_rank = playerData.country_rank;
                this.pp = playerData.pp;
                this.last_refresh = playerData.last_refresh;
                this.avatar_url = playerData.avatar;
                this.background_url = playerData.background;
                this.grade_ss = playerData.grade_ss;
                this.grade_ssh = playerData.grade_ssh;
                this.grade_s = playerData.grade_s;
                this.grade_sh = playerData.grade_sh;
                this.grade_a = playerData.grade_a;

                return true;
            }

            async refresh(pullFromOsu = false, sendSocket = false) {
                const userData = await getUser(this.id, pullFromOsu);

                if (!userData || !userData.user || userData.user.id == null) {
                    console.error("Could not refresh player:", this.id, userData);
                    return false;
                }

                if (sendSocket) {
                    publishRefresh(userData.user);
                }

                return this.updateData(userData.user);
            }

            set startingStats(stats) {
                this.starting_stats = stats;
            }

            set endingStats(stats) {
                this.ending_stats = stats;
            }

            renderPlacement() {
                this.placementEl.textContent = `${this.placement}`;
            }

            render() {
                this.element.replaceChildren();
                this.placementEl.textContent = `${this.placement}`;
                this.usernameEl.textContent = this.username || '';
                this.usernameEl.href = `https://osu.ppy.sh/users/${this.id}`;
                this.usernameEl.target = "_blank";
                if (this.avatar_url) {
                    this.avatarEl.src = this.avatar_url;
                }
                this.element.appendChild(this.placementEl);
                this.element.appendChild(this.avatarEl);
                this.element.appendChild(this.usernameEl);
                const gradient = 'linear-gradient(to right, rgba(25, 25, 25, 1) 0%, rgba(25, 25, 25, 1) 25%, rgba(25, 25, 25, 0.75) 50%, rgba(25, 25, 25, 0.5) 75%, rgba(30, 30, 30, 0.5) 100%)';
                const hasBackground = this.background_url && this.background_url !== 'undefined';
                this.element.style.background = hasBackground
                    ? `${gradient}, url('${this.background_url}')`
                    : gradient;
                this.element.style.backgroundSize = 'cover';
                this.element.style.backgroundPosition = 'center';
                this.objectiveEl.textContent = formatNumber(this[matchPrimary]);
                this.element.appendChild(this.objectiveEl);
                return this.element;
            }
        }

        // visual
        const playersList = document.getElementById('players-list');
        const teamsDiv = document.getElementById('teams');
        const recentPlaysDiv = document.getElementById('recent-plays');
        const youCardElement = document.getElementById('your-card');
        const youCard = new PlayerCard(ID);

        function youInTheMatch() {
            return players.has(youCard.id);
        }


        function formatNumber(num) {
            if (num === null || num === undefined) return '0';

            const absNum = Math.abs(num);

            if (absNum >= 1e12) {
                return (num / 1e12).toFixed(2) + ' T';
            } else if (absNum >= 1e9) {
                return (num / 1e9).toFixed(2) + ' B';
            } else if (absNum >= 1e6) {
                return (num / 1e6).toFixed(2) + ' M';
            } else if (absNum >= 1e3) {
                return (num / 1e3).toFixed(2) + ' K';
            }

            return num.toString();
        }

        function sort() {
            const sortedPlayers = Array.from(players.values()).sort((a, b) => b[matchPrimary] - a[matchPrimary]);

            sortedPlayers.forEach((player, index) => {
                player.placement = index + 1;
                player.renderPlacement();
            });

            const fragment = document.createDocumentFragment();
            sortedPlayers.forEach(player => {
                if (player.element.parentNode === playersList) {
                    playersList.removeChild(player.element);
                }
                fragment.appendChild(player.element);
                const currentPlayer = players.get(youCard.id);
                if (currentPlayer) {
                    youCard.placement = currentPlayer.placement;
                    youCard.renderPlacement();
                }
                player.element.classList.toggle(
                    'player-hidden',
                    (youInTheMatch()) ? player.placement > 8 : player.placement > 11
                );
            });
            playersList.appendChild(fragment);
        }

        // api
        function buildApiUrl(path) {
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port;

            let baseUrl = `${protocol}//${hostname}`;

            if (port && port !== '80' && port !== '443') {
                baseUrl += `:${port}`;
            }

            const normalizedPath = path.startsWith('/') ? path : `/${path}`;

            return `${baseUrl}${normalizedPath}`;
        }


        async function getUser(id, pullFromOsu = true) {
            const url = `${buildApiUrl('/api/osu/fetch-user')}/${id}?skip_api=${!pullFromOsu}?match=${matchId}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Failed to fetch user ${id}: ${response.status}`);
            }

            return response.json();
        }

        async function addPlayer(id, refresh = false) {
            const player = new PlayerCard(id);
            await player.refresh(refresh);
            players.set(player.id, player);
            const playerElement = player.render();
            playersList.appendChild(playerElement);
            if (player.id === ID) {
                const youContainer = document.getElementById('you-container');
                const yourCardContainer = document.getElementById('your-card');
                await youCard.refresh();
                const youElement = youCard.render();
                youContainer.style.display = 'block';
                yourCardContainer.appendChild(youElement);
            }
            sort();
        }

        // ws
        const configuredWebsocketUrl = {{ websocket_url|tojson }};

        function buildMatchWebsocketUrl() {
            if (configuredWebsocketUrl && String(configuredWebsocketUrl).trim() !== "") {
                return String(configuredWebsocketUrl).trim();
            }

            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            return `${wsProtocol}//${window.location.hostname}:8765`;
        }

        let ws = null;
        let reconnectTimeout = null;
        let closing = false;

        function connectWebSocket() {
            const wsUrl = buildMatchWebsocketUrl();
            console.log('Connecting to WebSocket:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = function(event) {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({
                    type: 'subscribe_match',
                    match_id: matchId
                }));
            };

            ws.onmessage = function(event) {
                console.log('WebSocket message received:', event.data);
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'refreshed' && data.match_id === matchId && data.user) {
                        const player = players.get(Number(data.user.id));
                        if (!player) {
                            console.warn('Received refresh for player not on this page:', data.user.id);
                            return;
                        }

                        player.updateData(data.user);
                        player.render();
                        if (player.id === ID) {
                            youCard.updateData(data.user);
                            youCard.render();
                        }
                        sort();
                    }

                } catch (e) {
                    console.error('Failed to parse WebSocket message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function(event) {
                console.log('WebSocket disconnected');
                if (!closing) {
                    reconnectTimeout = setTimeout(connectWebSocket, 3000);
                }
            };
        }

        function publishRefresh(user) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.warn('WebSocket is not connected; refresh was not shared');
                return false;
            }

            ws.send(JSON.stringify({
                type: 'refresh',
                match_id: matchId,
                user: user
            }));
            return true;
        }

        connectWebSocket();

        window.addEventListener('beforeunload', function() {
            closing = true;
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'unsubscribe_match',
                        match_id: matchId
                    }));
                }
                ws.close();
            }
        });

        // button logic
        document.getElementById('refresh-button').addEventListener('click', async function () {
            const player = await players.get(youCard.id);
            await player.refresh(true, true);
            sort();
        });

    </script>
    </body>
</html>
